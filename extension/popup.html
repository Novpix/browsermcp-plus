<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #07080a;
        --plate: linear-gradient(180deg, #1a1d22 0%, #121418 100%);
        --plate-hi: linear-gradient(180deg, #22262d 0%, #16191e 100%);
        --edge: rgba(255, 255, 255, 0.07);
        --edge-hi: rgba(255, 255, 255, 0.14);
        --fg: #e8ebef;
        --muted: #8a919b;
        --dim: #5c636d;
        --ok: #3ddc84;
        --warn: #f5b84b;
        --bad: #ff6b6b;
        --accent: #6ea8ff;
        --shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 -1px 0 rgba(0, 0, 0, 0.6) inset, 0 6px 16px rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 360px;
        padding: 14px;
        background: radial-gradient(120% 60% at 50% -10%, #161a22 0%, var(--bg) 60%);
        color: var(--fg);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      header img {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      header .version {
        color: var(--dim);
        font-size: 11px;
      }
      .pill {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--plate);
        border: 1px solid var(--edge);
        box-shadow: var(--shadow);
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }
      .pill.ok {
        color: var(--ok);
      }
      .pill.ok .dot {
        background: var(--ok);
        box-shadow: 0 0 8px var(--ok);
      }
      .pill.warn {
        color: var(--warn);
      }
      .pill.warn .dot {
        background: var(--warn);
        animation: blink 1.4s ease-in-out infinite;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .plate {
        background: var(--plate);
        border: 1px solid var(--edge);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .stat {
        padding: 9px 10px 8px;
        position: relative;
        overflow: hidden;
      }
      .stat::after {
        /* brushed-metal sheen */
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.05) 45%, transparent 60%);
        pointer-events: none;
      }
      .stat .value {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .stat .label {
        color: var(--muted);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .stat .sub {
        color: var(--dim);
        font-size: 11px;
        margin-top: 2px;
        white-space: nowrap;
      }
      .current {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        margin-bottom: 14px;
      }
      .current .meta {
        flex: 1;
        min-width: 0;
      }
      .ellipsis {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 11px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border-radius: 9px;
        padding: 7px 12px;
        cursor: pointer;
        border: 1px solid var(--edge-hi);
        color: var(--fg);
        background: var(--plate-hi);
        box-shadow: var(--shadow);
        transition: transform 0.08s ease, filter 0.15s ease;
        white-space: nowrap;
      }
      button:hover {
        filter: brightness(1.15);
      }
      button:active {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
        filter: none;
        transform: none;
      }
      button.primary {
        border-color: rgba(110, 168, 255, 0.55);
        background: linear-gradient(180deg, #4f8ff7 0%, #2f6fdc 100%);
        color: #fff;
      }
      button.danger {
        color: var(--bad);
        border-color: rgba(255, 107, 107, 0.35);
        width: 100%;
      }
      h2 {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--muted);
      }
      h2 .count {
        color: var(--dim);
      }
      section {
        margin-bottom: 14px;
      }
      .agent {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px 10px 9px 14px;
        margin-bottom: 7px;
        border-radius: 12px;
        font-weight: 400;
        overflow: hidden;
      }
      .agent::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--agent, var(--accent));
        box-shadow: 0 0 12px var(--agent, var(--accent));
      }
      .agent .top {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .agent .name {
        font-weight: 650;
        flex: 1;
        min-width: 0;
      }
      .agent .busy {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }
      .agent.working .busy {
        background: var(--agent, var(--ok));
        animation: pulse 1.1s ease-out infinite;
      }
      .chip {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--edge);
        font-size: 10.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .agent .line {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 4px;
      }
      .agent .error {
        margin-top: 5px;
        color: var(--bad);
        font-size: 11px;
      }
      .tabs {
        padding: 2px 0;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-top: 1px solid var(--edge);
      }
      .tab:first-child {
        border-top: 0;
      }
      .tab img,
      .tab .noicon {
        width: 14px;
        height: 14px;
        flex: none;
        border-radius: 3px;
      }
      .tab .noicon {
        background: rgba(255, 255, 255, 0.08);
      }
      .tab .title {
        flex: 1;
        min-width: 0;
      }
      .owner {
        font-size: 10.5px;
        font-weight: 600;
        padding: 1px 7px;
        border-radius: 6px;
        color: #0b0d10;
        background: var(--agent, var(--accent));
        white-space: nowrap;
      }
      .owner.free {
        color: var(--ok);
        background: rgba(61, 220, 132, 0.1);
        border: 1px solid rgba(61, 220, 132, 0.3);
      }
      .empty {
        padding: 12px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      .empty code {
        color: var(--fg);
        font-size: 11px;
      }
      #error {
        color: var(--bad);
        font-size: 12px;
        margin: -6px 0 10px;
      }
      #error:empty {
        display: none;
      }
      details {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      summary {
        cursor: pointer;
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::before {
        content: "⚙︎ ";
      }
      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
      }
      input {
        width: 86px;
        font: inherit;
        color: var(--fg);
        background: #0d0f12;
        border: 1px solid var(--edge-hi);
        border-radius: 7px;
        padding: 4px 7px;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 var(--agent, var(--ok));
        }
        100% {
          box-shadow: 0 0 0 7px transparent;
        }
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .agent.working .busy,
        .pill.warn .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/48.png" alt="" />
      <div>
        <h1>Browser MCP Plus</h1>
        <div class="version" id="version"></div>
      </div>
      <span class="pill" id="server"><span class="dot"></span><span id="serverText">…</span></span>
    </header>

    <div class="stats">
      <div class="plate stat">
        <div class="label">Agents</div>
        <div class="value" id="agentCount">0</div>
        <div class="sub" id="agentSub">none working</div>
      </div>
      <div class="plate stat">
        <div class="label">Tabs</div>
        <div class="value" id="tabCount">0</div>
        <div class="sub" id="tabSub">connected</div>
      </div>
      <div class="plate stat">
        <div class="label">Server</div>
        <div class="value" id="portValue">9009</div>
        <div class="sub">port</div>
      </div>
    </div>

    <div class="plate current">
      <div class="meta">
        <div class="small muted">This tab</div>
        <div class="ellipsis" id="currentText">…</div>
      </div>
      <button id="toggle" class="primary">Connect</button>
    </div>
    <div id="error"></div>

    <section>
      <h2>Agents <span class="count" id="agentHeading"></span></h2>
      <div id="agents"></div>
    </section>

    <section>
      <h2>Connected tabs <span class="count" id="tabHeading"></span></h2>
      <div class="plate tabs" id="tabs"></div>
    </section>

    <button id="stopAll" class="danger" hidden>Stop all agents and disconnect</button>

    <details>
      <summary>Settings</summary>
      <div class="setting">
        <label for="port">Server port</label>
        <input id="port" type="number" min="1" max="65535" />
      </div>
    </details>

    <script src="popup.js" type="module"></script>
  </body>
</html>
